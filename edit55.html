<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع جاسم | حاسبة النسبة المئوية والموزونة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        header p {
            font-size: 15px;
            color: #94a3b8;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
        }

        .calc-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 14px;
            color: #334155;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
            background: #f8fafc;
        }

        .form-group input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .calc-btn {
            background: #2563eb;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            margin-top: 10px;
        }

        .calc-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .result-box {
            display: none;
            margin-top: 30px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .result-box h3 {
            color: #166534;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 32px;
            font-weight: 900;
            color: #15803d;
        }

        footer {
            background: #0f172a;
            color: #94a3b8;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            margin-top: 40px;
        }

        footer span {
            color: #ffffff;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <header>
        <h1>موقع جاسم</h1>
        <p>حاسبة النسبة الموزونة للقبول الجامعي (ثانوية - قدرات - تحصيلي)</p>
    </header>

    <div class="container">
        <div class="calc-card">
            <form id="weightedForm" onsubmit="calculateWeighted(event)">
                <div class="form-group">
                    <label><i class="fa-solid fa-graduation-cap"></i> نسبة الثانوية العامة (وزنها 30%)</label>
                    <input type="number" id="highschool" step="0.01" min="0" max="100" required placeholder="مثال: 90">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-brain"></i> درجة اختبار القدرات العامة (وزنها 30%)</label>
                    <input type="number" id="qudrat" step="0.01" min="0" max="100" required placeholder="مثال: 85">
                </div>

                <div class="form-group">
                    <label><i class="fa-solid fa-book-open"></i> درجة اختبار التحصيلي (وزنها 40%)</label>
                    <input type="number" id="tahsili" step="0.01" min="0" max="100" required placeholder="مثال: 80">
                </div>

                <button type="submit" class="calc-btn">احسب النسبة الموزونة</button>
            </form>

            <div class="result-box" id="resultBox">
                <h3>نسبتك الموزونة النهائية:</h3>
                <div class="result-value" id="finalResult">0.00%</div>
            </div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة لصالح <span>موقع جاسم</span> &copy; 2026</p>
    </footer>

    <script>
        function calculateWeighted(event) {
            event.preventDefault();

            // النسب المعيارية الشائعة (30% ثانوية، 30% قدرات، 40% تحصيلي)
            let hs = parseFloat(document.getElementById('highschool').value) * 0.30;
            let qd = parseFloat(document.getElementById('qudrat').value) * 0.30;
            let th = parseFloat(document.getElementById('tahsili').value) * 0.40;

            let total = hs + qd + th;

            let resultBox = document.getElementById('resultBox');
            let finalResult = document.getElementById('finalResult');

            finalResult.textContent = total.toFixed(2) + '%';
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
