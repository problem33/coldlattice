<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الشخصية - ! 𝑾𝒊𝒕𝒄𝒉𝒆𝒓</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 50px auto;
            background: #1e293b;
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid #334155;
            text-align: center;
        }

        .profile-img-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background-color: #10b981;
            border: 3px solid #1e293b;
            border-radius: 50%;
        }

        h1 {
            font-size: 26px;
            font-weight: 900;
            color: #f1f5f9;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .bio {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .contact-form {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- صورة الحساب -->
        <div class="profile-img-container">
            <img src="https://cdn.discordapp.com/attachments/1346700261946560546/1532721483191816212/8355BE4E-C812-416E-89DC-14147A41450E.gif?ex=6a6de19e&is=6a6c901e&hm=e0f42a3086c1eb9d5fe16662c3a694ea3f3aefc2440fd315326b7fb722e7d12d&" alt="Witcher Profile" class="profile-img">
            <div class="status-dot"></div>
        </div>

        <!-- الاسم -->
        <h1>! 𝑾𝒊𝒕𝒄𝒉𝒆𝒓</h1>
        <p class="bio">أهلاً بك في صفحتي الشخصية. تواصل معي مباشرة عبر نموذج الرسائل أدناه.</p>

        <!-- نموذج استقبال الرسائل (عبر خدمة Formspree المجانية) -->
        <!-- ملاحظة: استبدل YOUR_FORM_ID في الرابط أدناه بمعرف حسابك في موقع Formspree بعد التسجيل المجاني -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST" class="contact-form">
            <div class="form-group">
                <label><i class="fa-solid fa-user"></i> اسمك / عنوانك:</label>
                <input type="text" name="name" required placeholder="أدخل اسمك هنا...">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-envelope"></i> بريدك الإلكتروني:</label>
                <input type="email" name="email" required placeholder="example@domain.com">
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-message"></i> رسالتك:</label>
                <textarea name="message" required placeholder="اكتب رسالتك هنا..."></textarea>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fa-solid fa-paper-plane"></i> إرسال الرسالة
            </button>
        </form>
    </div>

    <footer>
        تم التصميم بواسطة ! 𝑾𝒊𝒕𝒄𝒉𝒆𝒓 &copy; 2026
    </footer>

</body>
</html>
